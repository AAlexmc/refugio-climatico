<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OASI — Mapa de refugios</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f4f1; --surface: #fcfcfb; --border: #dcdcd6;
    --text: #0b0b0b; --text-2: #52514e; --muted: #6b6a63;
    --land: #e9ece3; --sea: #cfe3f1; --road: #b9b8ae; --road-main: #8d8c82; --park: #d5e3cc;
    --ok: #157f3b; --ok-bg: #dff3e5; --warn: #9a5b00; --warn-bg: #ffe9bf; --crit: #c52f2f; --crit-bg: #fbe0e0;
    --pin-ok: #157f3b; --pin-warn: #b86e00; --pin-crit: #c52f2f; --pin-nd: #6b6a63; --pin-glifo: #fff;
    --nd: #6b6a63; --accent: #2a78d6; --on-accent: #fff; --you: #6250d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0f1110; --surface: #1a1a19; --border: #33332f;
      --text: #f0efec; --text-2: #c3c2b7; --muted: #9a998f;
      --land: #23251f; --sea: #14283a; --road: #46463f; --road-main: #6e6d63; --park: #27341f;
      --ok: #55d27f; --ok-bg: #12301c; --warn: #ffc24d; --warn-bg: #3a2a08; --crit: #ff7b7b; --crit-bg: #3d1515;
      --pin-ok: #55d27f; --pin-warn: #ffc24d; --pin-crit: #ff7b7b; --pin-nd: #9a998f; --pin-glifo: #0b0b0b;
      --nd: #9a998f; --accent: #6aa7f2; --on-accent: #0b0b0b; --you: #a99cff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0 auto; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; max-width: 480px; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  header h1 { font-size: 1.05rem; margin: 0; flex: 1; }
  select, button { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; min-height: 44px; }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  .bar { padding: 0 12px 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .bar button.primary { flex: 1; }
  #net { font-size: .8rem; color: var(--muted); }
  svg#mapa { width: 100%; height: auto; display: block; background: var(--sea); touch-action: manipulation; }
  .land { fill: var(--land); stroke: var(--road-main); stroke-width: 1.5; }
  .calle { fill: none; stroke: var(--road-main); stroke-width: 3; stroke-linecap: round; }
  .rot { font-size: 8px; fill: var(--muted); letter-spacing: .5px; }
  .barrio { font-size: 9px; fill: var(--text-2); text-anchor: middle; font-weight: 600; opacity: .85; }
  .mar { font-size: 10px; fill: var(--accent); font-style: italic; }
  .pin { cursor: pointer; }
  .pin .nombre { font-size: 8.5px; fill: var(--text); text-anchor: middle; font-weight: 700; paint-order: stroke; stroke: var(--land); stroke-width: 3px; }
  .pin .glifo { font-size: 13px; font-weight: 800; text-anchor: middle; fill: var(--pin-glifo); pointer-events: none; }
  .pin.ok circle.c { fill: var(--pin-ok); } .pin.warn circle.c { fill: var(--pin-warn); } .pin.crit circle.c { fill: var(--pin-crit); } .pin.nd circle.c { fill: var(--pin-nd); }
  .pin circle.c { stroke: var(--surface); stroke-width: 2; }
  .pin circle.ring { fill: none; stroke: none; }
  .pin.sel circle.ring { stroke: var(--accent); stroke-width: 3; }
  .tu text { font-size: 8px; fill: var(--you); font-weight: 700; text-anchor: middle; }
  .tu circle { fill: var(--you); stroke: var(--surface); stroke-width: 2; }
  .ruta { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 5 4; fill: none; }
  #layout { display: block; }
  #lado { display: flex; flex-direction: column; }
  #vista3d { position: relative; margin: 10px 12px 0; height: 260px; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: #9ec9e6; }
  #vista3d canvas { width: 100% !important; height: 100% !important; display: block; }
  #vista3d.grande { position: fixed; inset: 0; margin: 0; height: 100vh !important; border-radius: 0; z-index: 50; }
  #cerrar3d { display: none; position: absolute; top: 12px; right: 12px; z-index: 3; font-size: 1.1rem; padding: 8px 14px; border-radius: 10px; border: 0; background: #0b1f2acc; color: #fff; cursor: pointer; }
  #info3d { display: none; position: absolute; left: 12px; top: 12px; z-index: 3; background: #0b1f2acc; color: #fff; padding: 10px 14px; border-radius: 10px; max-width: 70vw; font-size: .95rem; }
  #vista3d.grande #cerrar3d, #vista3d.grande #info3d { display: block; }
  #ampliar3d { position: absolute; right: 8px; bottom: 8px; z-index: 3; border: 0; border-radius: 8px; padding: 6px 10px; background: #0b1f2acc; color: #fff; cursor: pointer; }
  #vista3d.grande #ampliar3d { display: none; }
  #v3dmsg { position: absolute; inset: 0; display: grid; place-items: center; color: #234; font-size: .85rem; }
  @media (min-width: 860px) {
    #layout { display: grid; grid-template-columns: minmax(360px, 1fr) minmax(380px, 1.1fr); gap: 4px; align-items: start; }
    #vista3d { height: 380px; }
  }
  #ficha { margin: 10px 12px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
  #ficha h2 { margin: 0 0 6px; font-size: 1.15rem; }
  .estado { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: .9rem; }
  .estado.ok { background: var(--ok-bg); color: var(--ok); } .estado.warn { background: var(--warn-bg); color: var(--warn); }
  .estado.crit { background: var(--crit-bg); color: var(--crit); } .estado.nd { background: var(--border); color: var(--nd); }
  .tag { display: inline-block; font-size: .72rem; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-2); vertical-align: middle; }
  .tag.real { border-color: var(--ok); color: var(--ok); }
  .tag.sim { border-style: dashed; }
  dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 12px 0; }
  dt { color: var(--text-2); } dd { margin: 0; font-weight: 700; text-align: right; }
  .alerta { background: var(--crit-bg); color: var(--crit); padding: 8px 10px; border-radius: 8px; margin: 8px 0; font-weight: 600; }
  #ficha button { width: 100%; }
  .leyenda { padding: 0 12px 12px; font-size: .8rem; display: flex; gap: 8px; flex-wrap: wrap; }
  footer { padding: 0 12px 20px; font-size: .75rem; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1 id="t_titulo">OASI · Refugios cerca de ti</h1>
  <select id="lang" aria-label="Idioma / Language"><option value="es">ES</option><option value="ca">CA</option><option value="en">EN</option></select>
</header>
<div class="bar">
  <button class="primary" id="btnCerca"></button>
  <span id="net"></span>
</div>

<div id="layout">
<svg id="mapa" viewBox="0 0 360 370" role="img" aria-label="Mapa esquemático de Barcelona">
  <path class="land" d="M0,0 L360,0 L360,60 L335,90 L270,165 L215,215 L120,290 L10,350 L0,360 Z"/>
  <path d="M0,0 L120,0 L60,90 L0,130 Z" fill="var(--park)" opacity=".8"/>
  <path d="M40,300 L100,290 L128,288 L110,310 L50,335 Z" fill="var(--park)" opacity=".8"/>
  <path class="calle" d="M25,215 L238,127 L325,95"/>
  <path class="calle" d="M30,296 L88,252 L238,127"/>
  <path class="calle" d="M238,127 L275,15"/>
  <path class="calle" d="M88,252 L122,289"/>
  <text class="rot" transform="translate(100,170) rotate(-22)">Diagonal</text>
  <text class="rot" transform="translate(40,275) rotate(-38)">Gran Via</text>
  <text class="rot" transform="translate(264,80) rotate(-73)">Meridiana</text>
  <text class="rot" transform="translate(112,262) rotate(50)">Paral·lel</text>
  <text class="mar" x="270" y="240">Mediterrània</text>
  <g id="barrios"></g>
  <path id="ruta" class="ruta" d=""/>
  <g id="pins"></g>
  <g class="tu" id="tu"><circle r="6"/><text y="-10" id="t_tu">Tú</text></g>
</svg>
<aside id="lado">
  <div id="vista3d"><span id="v3dmsg">Cargando vista 3D…</span>
    <button id="cerrar3d" aria-label="Cerrar">✕ Volver al mapa</button><div id="info3d"></div>
    <button id="ampliar3d" aria-label="Pantalla completa">Ampliar</button></div>
  <section id="ficha"></section>
</aside>
</div>
<div class="leyenda" id="leyenda"></div>
<footer id="pie"></footer>

<script>
const I18N = {
  es: { titulo:"OASI · Refugios cerca de ti", cerca:"El más cercano con sitio", tu:"Tú", ok:"Hay sitio", warn:"Casi lleno (>70 %)", crit:"Lleno", nd:"Sin datos",
    real:"EN VIVO", sim:"simulado (demo)", dentro:"Temperatura dentro", calle:"Temperatura en la calle", libres:"Plazas libres", dist:"A pie", min:"min",
    como:"Cómo llegar", comoMsg:"Navegación no disponible en la demo.", selecciona:"Toca un refugio del mapa para ver su ficha.",
    nosit:"No hay ningún refugio con sitio ahora mismo.", conectado:"en vivo", desconectado:"sin conexión; reintentando…",
    gano:"Dentro se está", gradosMenos:"°C menos que en la calle", alerta:"Aviso",
    pie:"R1 (Pl. Catalunya) se alimenta en vivo del sistema. Los otros 5 refugios son datos simulados de la demo. Toca el mapa para mover tu posición." },
  ca: { titulo:"OASI · Refugis a prop teu", cerca:"El més proper amb lloc", tu:"Tu", ok:"Hi ha lloc", warn:"Gairebé ple (>70 %)", crit:"Ple", nd:"Sense dades",
    real:"EN DIRECTE", sim:"simulat (demo)", dentro:"Temperatura a dins", calle:"Temperatura al carrer", libres:"Places lliures", dist:"A peu", min:"min",
    como:"Com arribar-hi", comoMsg:"Navegació no disponible a la demo.", selecciona:"Toca un refugi del mapa per veure'n la fitxa.",
    nosit:"Ara mateix no hi ha cap refugi amb lloc.", conectado:"en directe", desconectado:"sense connexió; reintentant…",
    gano:"A dins fa", gradosMenos:"°C menys que al carrer", alerta:"Avís",
    pie:"R1 (Pl. Catalunya) s'alimenta en directe del sistema. Els altres 5 refugis són dades simulades de la demo. Toca el mapa per moure la teva posició." },
  en: { titulo:"OASI · Shelters near you", cerca:"Nearest with space", tu:"You", ok:"Space available", warn:"Almost full (>70 %)", crit:"Full", nd:"No data",
    real:"LIVE", sim:"simulated (demo)", dentro:"Temperature inside", calle:"Street temperature", libres:"Free spots", dist:"On foot", min:"min",
    como:"Get directions", comoMsg:"Navigation is not available in the demo.", selecciona:"Tap a shelter on the map to see its details.",
    nosit:"No shelter has space right now.", conectado:"live", desconectado:"offline; retrying…",
    gano:"Inside it is", gradosMenos:"°C cooler than the street", alerta:"Notice",
    pie:"R1 (Pl. Catalunya) is fed live by the system. The other 5 shelters are simulated demo data. Tap the map to move your position." }
};
const BARRIOS = [["Ciutat Vella",150,250],["Eixample",200,178],["Gràcia",160,112],["Sants",38,200],["Sant Martí",293,128],["Nou Barris",190,40],["Sarrià-St Gervasi",72,100]];
const GLIFO = {ok:"✓", warn:"!", crit:"✕", nd:"?"};
const M_POR_UNIDAD = 22, FACTOR_CALLE = 1.3, M_MIN = 80;

// aforo máx = módulos del kit × aforo del módulo (de /api/kits; constantes si falla)
const KIT_FALLBACK = {parada_bus:2, terraza_comunitaria:6, terraza_privada:1};
let KITS = {...KIT_FALLBACK}, AFORO_MOD = 10;
const R = [
  {id:"R1", nombre:"Pl. Catalunya",   x:165, y:205, kit:"parada_bus", n:2, arbol:true,  cubierta:"vidrio_control_solar", real:true, aforo:null, temp:null, ext:null, alerta:null},
  {id:"S2", nombre:"Sagrada Família", x:205, y:105, kit:"terraza_comunitaria", n:6, arbol:true, cubierta:"etfe_3_capas_frit", real:false, aforo:47, temp:27.4, ext:35.8},
  {id:"S3", nombre:"Glòries",         x:238, y:142, kit:"parada_bus", tipo:"marquesina", n:1, arbol:false, cubierta:"vidrio_control_solar", real:false, aforo:9, temp:29.5, ext:36.4},
  {id:"S4", nombre:"Sants Estació",   x:72,  y:222, kit:"parada_bus", tipo:"arbol_solar", n:1, arbol:true, cubierta:"vidrio_control_solar", real:false, aforo:6,  temp:29.0, ext:35.1},
  {id:"S5", nombre:"Pl. Espanya",     x:98,  y:268, kit:"terraza_comunitaria", n:4, arbol:true, cubierta:"policarbonato_opal_ir", real:false, aforo:21, temp:26.8, ext:35.5},
  {id:"S6", nombre:"Fabra i Puig",    x:252, y:62,  kit:"terraza_privada", tipo:"jardin", n:1, arbol:false, cubierta:"etfe_3_capas_frit", real:false, aforo:8,  temp:28.4, ext:36.0},
  {id:"S8", nombre:"Pl. Universitat", x:142, y:226, kit:"terraza_comunitaria", lugar:"plaza", tipo:"pabellon", n:2, arbol:false, cubierta:"vidrio_control_solar", real:false, aforo:11, temp:28.0, ext:36.1},
  {id:"S9", nombre:"Pl. de la Vila de Gràcia", x:176, y:150, kit:"terraza_comunitaria", lugar:"plaza", tipo:"pergola", n:2, arbol:false, cubierta:"vidrio_control_solar", real:false, aforo:12, temp:28.6, ext:35.7},
  {id:"S7", nombre:"Pl. del Sol",     x:150, y:122, kit:"terraza_privada", tipo:"banco_solar", n:1, arbol:false, cubierta:"vidrio_control_solar", real:false, aforo:4,  temp:30.2, ext:35.9}
];
const KIT_NOMBRE = {parada_bus:"Parada de bus", terraza_comunitaria:"Terraza comunitaria", terraza_privada:"Terraza privada"};
const TIPO_NOMBRE = {pergola:"Refugi climàtic: pérgola de madera con toldo tensado y núcleo de biblioteca", pabellon:"Pabellón Venturi 6 m (techo semicircular, extractores, puertas entrada/salida)", marquesina:"Marquesina bioclimática 6 × 2,2 m (vidrio con enredaderas, techo solar, chimenea, rociadores con cámara IA)", arbol_solar:"Árbol solar con nebulización", jardin:"Jardín vertical con pérgola solar", banco_solar:"Banco de piedra con placas solares"};
const CUB_NOMBRE = {vidrio_control_solar:"vidrio control solar", etfe_3_capas_frit:"ETFE serigrafiado", policarbonato_opal_ir:"policarbonato opal"};
let lang = (navigator.language || "es").slice(0, 2); if (!I18N[lang]) lang = "es";
let tu = {x:135, y:185}, sel = new URLSearchParams(location.search).get("sel") || "R1", rutaA = null, wsOk = false;
const t = k => I18N[lang][k];
const maxAforo = r => (r.n || KITS[r.kit] || KIT_FALLBACK[r.kit]) * AFORO_MOD;
const libres = r => r.aforo == null ? null : Math.max(0, maxAforo(r) - r.aforo);
function estado(r){ if (r.aforo == null) return "nd"; const f = r.aforo / maxAforo(r); return f >= 1 ? "crit" : f > 0.7 ? "warn" : "ok"; }
const dist = r => Math.hypot(r.x - tu.x, r.y - tu.y);
const metros = r => Math.round(dist(r) * M_POR_UNIDAD * FACTOR_CALLE / 10) * 10;
const NS = "http://www.w3.org/2000/svg";
const fmt = v => v == null ? "—" : v.toFixed(1) + " °C";

function dibujar(){
  document.documentElement.lang = lang;
  document.getElementById("t_titulo").textContent = t("titulo");
  document.getElementById("btnCerca").textContent = "📍 " + t("cerca");
  document.getElementById("pie").textContent = t("pie");
  document.getElementById("net").textContent = wsOk ? "● " + t("conectado") : "○ " + t("desconectado");
  document.getElementById("barrios").innerHTML = BARRIOS.map(b => `<text class="barrio" x="${b[1]}" y="${b[2]}">${b[0]}</text>`).join("");
  document.getElementById("leyenda").innerHTML = ["ok","warn","crit","nd"].map(e => `<span class="estado ${e}">${GLIFO[e]} ${t(e)}</span>`).join("");
  document.getElementById("tu").setAttribute("transform", `translate(${tu.x},${tu.y})`);
  document.getElementById("t_tu").textContent = t("tu");
  const pins = document.getElementById("pins"); pins.innerHTML = "";
  for (const r of R){
    const e = estado(r), g = document.createElementNS(NS, "g");
    g.setAttribute("class", `pin ${e}${sel === r.id ? " sel" : ""}`);
    g.setAttribute("transform", `translate(${r.x},${r.y})`);
    g.setAttribute("role", "button"); g.setAttribute("tabindex", "0");
    g.setAttribute("aria-label", `${r.nombre}: ${t(e)}`);
    g.innerHTML = `<circle class="ring" r="19"/><circle class="c" r="12"/><text class="glifo" y="5">${GLIFO[e]}</text><text class="nombre" y="26">${r.nombre}</text><circle r="22" fill="transparent"/>`;
    g.addEventListener("click", ev => { ev.stopPropagation(); sel = r.id; rutaA = null; window.__abrir3d = true; dibujar(); });
    g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { sel = r.id; rutaA = null; dibujar(); } });
    pins.appendChild(g);
  }
  const a = R.find(r => r.id === rutaA);
  document.getElementById("ruta").setAttribute("d", a ? `M${tu.x},${tu.y} L${a.x},${a.y}` : "");
  ficha();
}
function ficha(){
  const el = document.getElementById("ficha"), r = R.find(x => x.id === sel);
  if (!r){ el.innerHTML = `<p style="margin:0;color:var(--text-2)">${t("selecciona")}</p>`; return; }
  const e = estado(r), l = libres(r), m = metros(r), mins = Math.max(1, Math.round(m / M_MIN));
  const dif = (r.temp != null && r.ext != null) ? r.ext - r.temp : null;
  el.innerHTML = `<h2>${r.nombre} <span class="tag ${r.real ? "real" : "sim"}">${r.real ? "● " + t("real") : t("sim")}</span></h2>
    <span class="estado ${e}">${GLIFO[e]} ${t(e)}</span>
    <p style="margin:8px 0 0;color:var(--text-2);font-size:.85rem">${r.tipo ? TIPO_NOMBRE[r.tipo] : `${KIT_NOMBRE[r.kit]} · ${r.n} módulo${r.n > 1 ? "s" : ""} · ${CUB_NOMBRE[r.cubierta]}${r.arbol ? " · árbol solar" : ""}`} · fuente de agua</p>
    ${r.alerta ? `<div class="alerta">⚠ ${t("alerta")}: ${r.alerta}</div>` : ""}
    <dl>
      <dt>${t("dentro")}</dt><dd>${fmt(r.temp)}</dd>
      <dt>${t("calle")}</dt><dd>${fmt(r.ext)}</dd>
      <dt>${t("libres")}</dt><dd>${l == null ? "—" : l + " / " + maxAforo(r)}</dd>
      <dt>${t("dist")}</dt><dd>${m} m · ~${mins} ${t("min")}</dd>
    </dl>
    ${dif != null && dif > 0 ? `<p style="margin:0 0 10px;color:var(--ok);font-weight:600">${t("gano")} ${dif.toFixed(1)} ${t("gradosMenos")}</p>` : ""}
    <button class="primary" id="btnComo">${t("como")}</button>`;
  document.getElementById("btnComo").onclick = () => alert(`${t("como")}: ${r.nombre} (${m} m)\n${t("comoMsg")}`);
  window.__refSel = r; dispatchEvent(new CustomEvent("refugio-sel", {detail: r}));
}
document.getElementById("btnCerca").onclick = () => {
  const c = R.filter(r => { const e = estado(r); return e === "ok" || e === "warn"; }).sort((a, b) => dist(a) - dist(b))[0];
  if (!c){ alert(t("nosit")); return; }
  sel = c.id; rutaA = c.id; dibujar();
};
document.getElementById("mapa").addEventListener("click", ev => {
  const svg = ev.currentTarget, p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
  const q = p.matrixTransform(svg.getScreenCTM().inverse()); tu = {x: q.x, y: q.y}; rutaA = null; dibujar();
});
document.getElementById("lang").onchange = ev => { lang = ev.target.value; dibujar(); };
document.getElementById("lang").value = lang;

fetch("/api/kits").then(r => r.ok ? r.json() : Promise.reject()).then(d => {
  if (d.modulo && d.modulo.aforo) AFORO_MOD = d.modulo.aforo;
  for (const k of d.kits || []) if (k.id && k.modulos) KITS[k.id] = k.modulos;
  dibujar();
}).catch(() => {});

// R1 = el único refugio real: eventos del WebSocket
const r1 = R[0], alertasR1 = {};
function evento(ev){
  if (ev.refugio !== "R1") return;
  const v = ev.valor;
  if (ev.tipo === "temp" && typeof v === "number") r1.temp = v;
  else if (ev.tipo === "temp_ext" && typeof v === "number") r1.ext = v;
  else if (ev.tipo === "aforo" && typeof v === "number") r1.aforo = v;
  else if (ev.tipo === "alerta" && v && v.codigo){
    if (v.nivel === "info") delete alertasR1[v.codigo]; else alertasR1[v.codigo] = v.mensaje || v.codigo;
    r1.alerta = Object.values(alertasR1).join(" · ") || null;
  } else return;
  dibujar();
}
function conectar(){
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { wsOk = true; dibujar(); };
  ws.onclose = () => { wsOk = false; dibujar(); setTimeout(conectar, 2000); };
  ws.onerror = () => ws.close();
  ws.onmessage = m => { try { evento(JSON.parse(m.data)); } catch (e) {} };
}
dibujar(); conectar();
</script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/" } }</script>
<script type="module">
// Vista 3D del refugio seleccionado: mismo modelo que el gemelo (oasi3d.js), con su kit,
// módulos, cubierta y árbol solar. Personas: R1 en vivo (WebSocket); los simulados, tantas
// como su aforo (máx. 14 para que vaya fluido), sentadas en bancos o de pie.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { construirRefugio } from './oasi3d.js';
import { construirEntorno, LUGAR_POR_KIT } from './entorno.js';
const cont = document.getElementById('vista3d');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
cont.appendChild(renderer.domElement); document.getElementById('v3dmsg').remove();
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9ec9e6);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x667766, 0.8));
const sol = new THREE.DirectionalLight(0xfff2d8, 2.2); sol.position.set(8, 14, 6); sol.castShadow = true;
sol.shadow.mapSize.set(1024, 1024); Object.assign(sol.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 }); scene.add(sol);
let entorno = null;
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.48; controls.autoRotate = true; controls.autoRotateSpeed = 0.8;
renderer.domElement.addEventListener('pointerdown', () => controls.autoRotate = false);
let refugio = null, actual = null, vivo = [];
function gente(r) {
  if (r.real) return vivo;
  const n = Math.min(14, r.aforo || 0), L = refugio.limites, out = [];
  let s = 7 + r.id.charCodeAt(1);
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) out.push({ id: i + 1, x: L.minX + 0.5 + rnd() * (L.maxX - L.minX - 1), y: -(L.minZ + 0.5 + rnd() * (L.maxZ - L.minZ - 1)),
    estado: rnd() < 0.45 ? 'sentado' : 'de_pie' });
  return out;
}
function mostrar(r) {
  if (!r || (actual && actual.id === r.id && actual.aforo === r.aforo)) return;
  actual = r; refugio?.dispose(); entorno?.dispose(); entorno = construirEntorno(scene, r.lugar || LUGAR_POR_KIT[r.kit] || 'bus');
  refugio = construirRefugio(scene, { kit: r.kit, n: r.n, arbol: r.arbol, cubierta: r.cubierta, tipo: r.tipo || 'cupula', etiquetas: false });
  refugio.set({ temp: r.temp, solar: 900 * r.n, bateria: 70, ac: !r.tipo && (r.temp ?? 0) > 27, claraboya: 0, nebulizador: !!r.tipo });
  refugio.setPersonas(gente(r));
  const c = refugio.centro, d = Math.max(9, r.n * 2.6 + 6) * (r.arbol ? 1.15 : 1);
  controls.target.copy(c);
  if (r.tipo === 'pergola') camera.position.set(c.x - 6, 2.8, c.z + 12);   // bajo el toldo se ve el núcleo
  else camera.position.set(c.x + d * 0.85, d * 0.55, c.z + d * 0.75);
  controls.autoRotate = true;
}
function grande(on) { cont.classList.toggle('grande', on); requestAnimationFrame(ajustar); }
document.getElementById('cerrar3d').onclick = () => grande(false);
document.getElementById('ampliar3d').onclick = () => grande(true);
addEventListener('keydown', e => { if (e.key === 'Escape') grande(false); });
addEventListener('refugio-sel', e => {
  const r = e.detail; mostrar(r);
  document.getElementById('info3d').innerHTML = `<b>${r.nombre}</b><br>${document.querySelector('#ficha p')?.textContent || ''}<br>` +
    `Dentro ${r.temp ?? '—'} °C · calle ${r.ext ?? '—'} °C · ${r.aforo ?? '—'} personas`;
  if (window.__abrir3d) { window.__abrir3d = false; grande(true); }
});
if (window.__refSel) mostrar(window.__refSel);
// R1 en vivo: sus personas y actuadores vienen del WebSocket
(function ws() {
  const w = new WebSocket(`ws://${location.host}/ws`);
  w.onclose = () => setTimeout(ws, 1500);
  w.onmessage = m => { const ev = JSON.parse(m.data); if (ev.refugio && ev.refugio !== 'R1') return;
    if (ev.tipo === 'personas' && Array.isArray(ev.valor)) { vivo = ev.valor; if (actual?.real) refugio.setPersonas(vivo); }
    else if (actual?.real && ['claraboya','ac','nebulizador','ventilador','temp','solar','bateria'].includes(ev.tipo)) refugio.set({ [ev.tipo]: ev.valor });
    else if (actual?.real && ev.tipo === 'desmayo') refugio.setDesmayo(ev.valor); };
})();
function ajustar() { const w = cont.clientWidth, h = cont.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(ajustar).observe(cont); ajustar();
const reloj = new THREE.Clock();
renderer.setAnimationLoop(() => { const dt = Math.min(reloj.getDelta(), 0.1); refugio?.actualizar(dt); controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
