<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OASI — gemelo 3D</title>
<style>
  :root { --bg:#0f1714; --card:#17221dcc; --txt:#e6efe9; --mut:#8aa397; --ok:#3ecf8e; --cr:#ff3b3b; --acc:#5cc8ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; }
  canvas { display:block; width:100%; height:100%; }
  nav { position:fixed; left:12px; top:66px; z-index:5; font-size:14px; }
  nav a { color:var(--acc); margin-right:10px; }
  #hud { position:fixed; right:10px; top:66px; width:190px; background:var(--card); border-radius:10px; padding:10px 12px; z-index:5; font-size:13px; }
  #hud h2 { margin:0 0 6px; font-size:14px; }
  #hud div { display:flex; justify-content:space-between; padding:2px 0; } #hud span { color:var(--mut); } #hud b { font-weight:600; }
  #estado { position:fixed; left:12px; bottom:10px; z-index:5; font-size:13px; padding:4px 10px; border-radius:12px; background:var(--card); }
  #estado.off { color:#ffb347; }
  #afluencia { position:fixed; left:50%; transform:translateX(-50%); bottom:64px; z-index:8; background:#e9a400; color:#111;
    font-weight:700; padding:8px 16px; border-radius:10px; display:none; max-width:92vw; text-align:center; }
  #guion { position:fixed; left:50%; transform:translateX(-50%); bottom:16px; z-index:8; background:#1d3a52; color:var(--txt);
    border:2px solid var(--acc); padding:8px 16px; border-radius:10px; display:none; max-width:80vw; text-align:center; }
  #banner { position:fixed; left:0; right:0; top:0; z-index:9; background:var(--cr); color:#fff; text-align:center; font-weight:700;
    font-size:26px; padding:14px; display:none; animation:pulso 1s infinite; }
  @keyframes pulso { 50% { background:#a00; } }
  #cfg { position:fixed; left:12px; top:96px; z-index:6; width:230px; background:var(--card); border-radius:10px; padding:10px 12px; font-size:13px;
    display:flex; flex-direction:column; gap:7px; }
  #cfg label { display:flex; justify-content:space-between; align-items:center; gap:6px; color:var(--mut); }
  #cfg select { background:#0f1714; color:var(--txt); border:1px solid #35503f; border-radius:6px; padding:3px; max-width:140px; }
  #cfg button { background:#24342c; color:var(--txt); border:1px solid #35503f; border-radius:6px; padding:5px 9px; cursor:pointer; }
  #cfg .nbox { display:flex; align-items:center; gap:8px; } #cfg .nbox b { color:var(--txt); min-width:14px; text-align:center; }
  #cfg small { color:var(--mut); }
  @media (max-width:500px) { #cfg { top:auto; bottom:52px; width:calc(100vw - 24px); } }
  @media (max-width:500px) { #hud { width:150px; font-size:12px; } }
</style>
</head>
<body>
<div id="banner"></div>
<div id="cfg">
  <b>Configurar refugio</b>
  <label>Tipo <select id="c_tipo"><option value="cupula">Cúpula modular</option><option value="marquesina">Marquesina bioclimática</option><option value="arbol_solar">Árbol solar + agua</option>
    <option value="jardin">Jardín vertical + pérgola FV</option><option value="banco_solar">Banco de piedra + placas</option></select></label>
  <label id="l_kit">Kit <select id="c_kit"><option value="parada_bus">Parada de bus</option><option value="terraza_comunitaria">Terraza comunitaria</option>
    <option value="terraza_privada">Terraza privada</option></select></label>
  <label id="l_n">Módulos <span class="nbox"><button id="c_menos">−</button><b id="c_n">2</b><button id="c_mas">+</button></span></label>
  <label id="l_cub">Cubierta <select id="c_cub"><option value="vidrio_control_solar">Vidrio control solar</option><option value="etfe_3_capas_frit">ETFE serigrafiado</option>
    <option value="policarbonato_opal_ir">Policarbonato opal</option></select></label>
  <label id="l_arb"><input type="checkbox" id="c_arbol" checked> Árbol solar al lado</label>
  <small id="c_info"></small>
  <button id="c_aplicar">Aplicar al refugio real</button>
</div>
<div id="afluencia"></div>
<div id="guion"></div>
<nav><a href="/">Panel</a><a href="/camara.html">Cámara</a><a href="/metricas.html">Métricas</a><a href="/configurador.html">Configurador</a><a href="/mapa.html">Mapa</a></nav>
<div id="hud">
  <h2>Refugio <span id="h_ref"></span></h2>
  <div><span>Interior</span><b id="h_temp">—</b></div>
  <div><span>Exterior</span><b id="h_ext">—</b></div>
  <div><span>Aforo</span><b id="h_aforo">—</b></div>
  <div><span>Batería</span><b id="h_bat">—</b></div>
  <div><span>Solar</span><b id="h_sol">—</b></div>
  <div><span>Claraboya</span><b id="h_cla">—</b></div>
  <div><span>AC</span><b id="h_ac">—</b></div>
  <div><span>Nebulizador</span><b id="h_neb">—</b></div>
  <div><span>Ventilador</span><b id="h_ven">—</b></div>
</div>
<div id="estado" class="off">sin conexión</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/" } }</script>
<script type="module" src="./gemelo.js"></script>
</body>
</html>
